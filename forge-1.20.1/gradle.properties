# 代理：只有走代理的域名用 proxyHost；直连可用的域名必须放进 nonProxyHosts，
# 否则会被代理下载（下到一半截断，报 SSLException: (bad_record_mac) Tag mismatch）。
#
# 注意：org.gradle.jvmargs 里不能塞 nonProxyHosts ——
# jvmargs 是空格分隔的 JVM 参数列表，里面的 | 会被当成普通字符，
# 后半截被当成独立的 JVM 参数，gradle daemon 起不来。
# 代理只放 systemProp.http(s).proxyHost/Port/nonProxyHosts。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=65532
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=65532
systemProp.http.nonProxyHosts=localhost|127.0.0.1|libraries.minecraft.net|launchermeta.mojang.com|piston-data.mojang.com|piston-meta.mojang.com|maven.fabricmc.net|maven.minecraftforge.net|repo.maven.apache.org|repo1.maven.org|maven.aliyun.com|files.minecraftforge.net
systemProp.https.nonProxyHosts=localhost|127.0.0.1|libraries.minecraft.net|launchermeta.mojang.com|piston-data.mojang.com|piston-meta.mojang.com|maven.fabricmc.net|maven.minecraftforge.net|repo.maven.apache.org|repo1.maven.org|maven.aliyun.com|files.minecraftforge.net
org.gradle.jvmargs=-Xmx3G
org.gradle.workers.max=1
