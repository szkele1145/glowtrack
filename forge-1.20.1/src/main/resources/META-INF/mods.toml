modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/szkele1145/glowtrack/issues"

[[mixins]]
config = "glowtrack.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "glowtrack_logo.png"

[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Xaero 联动是可选能力：装了才有小地图叠加，没装模组照常运行。
# 因此这里是 mandatory = false —— 标成 required 会让没装 Xaero 的玩家直接被拦在启动画面。
[[dependencies.${mod_id}]]
    modId = "xaeroworldmap"
    mandatory = false
    versionRange = "[1.47,)"
    ordering = "AFTER"
    side = "CLIENT"

[[dependencies.${mod_id}]]
    modId = "xaerominimap"
    mandatory = false
    versionRange = "[26,)"
    ordering = "AFTER"
    side = "CLIENT"
