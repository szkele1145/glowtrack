plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '1.4.8'
group = 'com.glowtrack'
base { archivesName = 'glowtrack' }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                glowtrack { source sourceSets.main }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods {
                glowtrack { source sourceSets.main }
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'

    // Xaero 世界地图 / 小地图（可选依赖，仅编译期用于 Mixin 离线；未安装则运行时跳过）
    compileOnly files('libs/xaeroworldmap-forge-1.20.1.jar')
    compileOnly files('libs/xaerominimap-forge-1.20.1.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// ==== 零依赖回归自检 ====
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'Runs the zero-dependency glowtrack regression self-test.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.glowtrack.track.GlowTrackSelfTest'
}
// Gradle 8.10 没有 failOnNoDiscoveredTests（8.12+ 才有），改用 filter 容错
tasks.named('test') {
    filter { setFailOnNoMatchingTests(false) }
}

processResources {
    var replaceProperties = [
            minecraft_version      : '1.20.1',
            minecraft_version_range: '[1.20.1,1.21)',
            forge_version          : '47.2.0',
            forge_version_range    : '[47,)',
            loader_version_range   : '[47,)',
            mod_id                 : 'glowtrack',
            mod_name               : 'GlowTrack',
            mod_license            : 'MIT',
            mod_version            : project.version,
            mod_authors            : 'GlowTrack',
            mod_description        : 'Player movement trajectory tracker with glowing 3D path rendering, timeline review, teleport, and Xaero map integration.'
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    archiveFileName = "glowtrack-${version}-1.20.1-forge.jar"
    manifest {
        attributes([
                'Specification-Title'     : 'glowtrack',
                'Specification-Vendor'    : 'GlowTrack',
                'Specification-Version'   : '1',
                'Implementation-Title'    : 'GlowTrack',
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'GlowTrack'
        ])
    }
}

// 说明：ForgeGradle 6 里 `reobfJar` 是 RewriteSourcesTask（不是 Jar），
// 所以文件名只在 `jar` 上设置；重混淆产物沿用同一份 archiveFileName。

tasks.named('check') { dependsOn tasks.named('selfTest') }
