org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true

# 本地已缓存的 NeoForge 版本
neo_version=21.1.248

# 本地 JDK 21（Temurin 完整 JDK，含 javac；复制到纯 ASCII 路径——properties 按 ISO-8859-1 读，中文路径会乱码）
# daemon 强制用完整 JDK；toolchain 关闭自动探测，只认下面的 installations.paths，
# 否则会探测到 PATH 上的 JRE（无 javac）导致 NFRT RecompileSourcesAction NPE
org.gradle.java.home=D:/tools/jdk21
org.gradle.java.installations.paths=D:/tools/jdk21
org.gradle.java.installations.auto-detect=false

# 本地代理（maven.neoforged.net 直连不通）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=65532
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=65532
systemProp.http.nonProxyHosts=localhost|127.0.0.1
