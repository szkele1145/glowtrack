plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.4.5'
group = 'com.glowtrack'
base { archivesName = 'glowtrack' }

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        glowtrack { sourceSet sourceSets.main }
    }
}

// Xaero 世界地图（可选依赖，仅编译期用于 Mixin GuiMap 画线；未安装则运行时跳过�?
// jar 已手动下载到 libs/（本地代理对 chocolateminecraft.com �?TLS 拦截，远程仓库不可靠�?
dependencies {
    compileOnly files('libs/xaeroworldmap-neoforge-1.21.1-1.47.0.jar')
    compileOnly files('libs/xaerominimap-neoforge-1.21.1-26.6.0.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// ==== 零依赖回归自检 ====
// 本机 mavenCentral 不可达，装不了 JUnit；改用自带 main 的 selfTest，
// 失败即构建失败。core/worldreplay 同款做法。
//
// moddev 只把 Minecraft 依赖挂在 main 上，test 源集看不到 ResourceLocation 等类，
// 这里把 main 的编译/运行 classpath 借给 test。
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'Runs the zero-dependency glowtrack regression self-test.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.glowtrack.track.GlowTrackSelfTest'
}
tasks.named('check') {
    dependsOn tasks.named('selfTest')
}
// Gradle 9 起 test 任务在"没发现任何测试"时默认报错——真正的回归保障是 selfTest
tasks.named('test') {
    failOnNoDiscoveredTests = false
}

processResources {
    var replaceProperties = [
            minecraft_version: '1.21.1',
            minecraft_version_range: '[1.21.1,1.22)',
            neo_version: project.neo_version,
            neo_version_range: '[21.1.0,)',
            mod_id: 'glowtrack',
            mod_name: 'GlowTrack',
            mod_license: 'MIT',
            mod_version: project.version,
            mod_authors: 'GlowTrack',
            mod_description: 'Player movement trajectory tracker with glowing 3D path rendering, timeline review, teleport, and Xaero map integration.'
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

